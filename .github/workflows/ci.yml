name: CI

# Runs the Kotlin Multiplatform test suite on every push/PR. This is a library module
# (conveyance-liquid) published via JitPack, not an installable Android app -- there is no
# `app/` module, no APK, and no `assembleDebug`/`test` Gradle task. `allTests` (which currently
# resolves to `desktopTest`, since Android host tests aren't enabled for this module) is the real
# verification task; see `./gradlew tasks --all` for the full list this project actually exposes.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew allTests --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
